<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linux 监控</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0f0f1a;
    color: #c8d6e5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
}
header {
    background: linear-gradient(135deg, #16213e, #1a1a2e);
    padding: 12px 32px;
    display: flex;
    align-items: center;
    gap: 20px;
    border-bottom: 1px solid #2a2a4a;
    position: sticky;
    top: 0;
    z-index: 100;
    flex-wrap: wrap;
}
header h1 {
    font-size: 20px;
    font-weight: 600;
    color: #00d2ff;
    white-space: nowrap;
}
.header-info {
    display: flex;
    gap: 24px;
    font-size: 13px;
    color: #8899aa;
}
.header-info span { display: flex; align-items: center; gap: 6px; }
.header-info .value { color: #c8d6e5; font-weight: 500; }
#status-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-left: auto;
}
#status-dot.connected { background: #00e676; box-shadow: 0 0 6px #00e67688; }
#status-dot.disconnected { background: #ff5252; box-shadow: 0 0 6px #ff525288; }

/* Host tabs */
.host-tabs {
    display: flex;
    gap: 4px;
    padding: 0 32px 8px;
    background: #16213e;
    border-bottom: 1px solid #1e2d50;
    flex-wrap: wrap;
}
.host-tab {
    padding: 6px 16px;
    border-radius: 6px 6px 0 0;
    font-size: 13px;
    cursor: pointer;
    border: 1px solid transparent;
    border-bottom: none;
    background: transparent;
    color: #8899aa;
    transition: all 0.15s;
}
.host-tab:hover {
    background: #1a2a4a;
    color: #c8d6e5;
}
.host-tab.active {
    background: #0f0f1a;
    border-color: #2a2a4a;
    color: #00d2ff;
    font-weight: 600;
}
.host-tab .host-count {
    font-size: 10px;
    color: #556;
    margin-left: 4px;
}

.dashboard {
    max-width: 1400px;
    margin: 0 auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
}
.card {
    background: #16213e;
    border-radius: 10px;
    border: 1px solid #1e2d50;
    overflow: hidden;
}
.card-title {
    padding: 12px 20px;
    font-size: 14px;
    font-weight: 600;
    color: #00d2ff;
    border-bottom: 1px solid #1e2d50;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.card-body { padding: 12px; }
.chart { width: 100%; height: 280px; }
.chart-sm { height: 220px; }
.chart-lg { height: 320px; }
.row { display: flex; gap: 16px; }
.row .card { flex: 1; }
@media (max-width: 768px) {
    .row { flex-direction: column; }
    header { flex-wrap: wrap; }
    .chart { height: 240px; }
}
.loading {
    display: flex; align-items: center; justify-content: center;
    height: 200px; color: #556; font-size: 14px;
}
</style>
</head>
<body>

<header>
    <h1>Linux 监控</h1>
    <div class="header-info">
        <span>当前主机：<span class="value" id="hostname">--</span></span>
        <span>更新：<span class="value" id="last-update">--</span></span>
        <span>数据点：<span class="value" id="point-count">0</span></span>
    </div>
    <span id="status-dot" class="disconnected"></span>
</header>

<div class="host-tabs" id="host-tabs"></div>

<main class="dashboard">

<div class="card">
    <div class="card-title">CPU 负载</div>
    <div class="card-body"><div id="chart-cpu-load" class="chart"></div></div>
</div>

<div class="card">
    <div class="card-title">CPU 核心使用率</div>
    <div class="card-body"><div id="chart-cpu-usage" class="chart chart-lg"></div></div>
</div>

<div class="row">
    <div class="card">
        <div class="card-title">内存使用</div>
        <div class="card-body" style="display:flex;gap:12px;flex-wrap:wrap;">
            <div id="chart-mem-gauge" style="width:200px;height:200px;flex-shrink:0;"></div>
            <div id="chart-mem-detail" style="flex:1;min-width:280px;height:200px;"></div>
        </div>
    </div>
    <div class="card">
        <div class="card-title">网络流量</div>
        <div class="card-body"><div id="chart-network" class="chart chart-sm"></div></div>
    </div>
</div>

<div class="card">
    <div class="card-title">软中断（每 CPU）</div>
    <div class="card-body"><div id="chart-softirq" class="chart chart-lg"></div></div>
</div>

</main>

<script>
const MAX_POINTS = 30;

// Per-host data state: data[hostname] = { times, cpuLoad, cpuUsage, ... }
const data = {};
let hostOrder = [];        // ordered list of hostnames
let currentHost = null;

const SOFTIRQ_NAMES = ['hi', 'timer', 'net_tx', 'net_rx', 'block', 'irq_poll', 'tasklet', 'sched', 'hrtimer', 'rcu'];
const SOFTIRQ_LABELS = ['HI', 'TIMER', 'NET_TX', 'NET_RX', 'BLOCK', 'IRQ_POLL', 'TASKLET', 'SCHED', 'HRTIMER', 'RCU'];
const SOFTIRQ_COLORS = ['#ff6b6b','#ffd93d','#6bcb77','#00d2ff','#a66cff','#ff8a5c','#45b7d1','#f472b6','#84cc16','#f59e0b'];

// ─── Helper: ensure host state exists ───

function ensureHost(name) {
    if (!data[name]) {
        data[name] = {
            times: [],
            cpuLoad: { load1: [], load3: [], load15: [] },
            cpuUsage: {},
            cpuUsageExists: {},
            memGauge: [],
            netSeries: {},
            netData: {},
            softIrqSeries: { _inited: false },
        };
    }
    if (!hostOrder.includes(name)) {
        hostOrder.push(name);
        renderHostTabs();
    }
}

function getHost(name) {
    return data[name] || null;
}

function currentState() {
    return currentHost ? getHost(currentHost) : null;
}

// ─── Chart initialization ───

const chartCpuLoad = echarts.init(document.getElementById('chart-cpu-load'), undefined, { renderer: 'canvas' });
chartCpuLoad.setOption({
    tooltip: { trigger: 'axis' },
    legend: { data: ['1 分钟', '5 分钟', '15 分钟'], textStyle: { color: '#8899aa' } },
    grid: { left: 50, right: 20, top: 40, bottom: 30 },
    xAxis: { type: 'category', data: [], axisLabel: { color: '#556' } },
    yAxis: { type: 'value', name: 'Load', nameTextStyle: { color: '#556' }, axisLabel: { color: '#889' } },
    series: [
        { name: '1 分钟', type: 'line', smooth: true, data: [], lineStyle: { width: 2 }, itemStyle: { color: '#ff6b6b' } },
        { name: '5 分钟', type: 'line', smooth: true, data: [], lineStyle: { width: 2 }, itemStyle: { color: '#ffd93d' } },
        { name: '15 分钟', type: 'line', smooth: true, data: [], lineStyle: { width: 2 }, itemStyle: { color: '#6bcb77' } },
    ]
});

const chartCpuUsage = echarts.init(document.getElementById('chart-cpu-usage'), undefined, { renderer: 'canvas' });
chartCpuUsage.setOption({
    tooltip: { trigger: 'axis' },
    legend: { data: [], textStyle: { color: '#8899aa' } },
    grid: { left: 50, right: 20, top: 40, bottom: 30 },
    xAxis: { type: 'category', data: [], axisLabel: { color: '#556' } },
    yAxis: { type: 'value', name: '%', max: 100, nameTextStyle: { color: '#556' }, axisLabel: { color: '#889' } },
    series: []
});

const chartMemGauge = echarts.init(document.getElementById('chart-mem-gauge'), undefined, { renderer: 'canvas' });
chartMemGauge.setOption({
    series: [{
        type: 'gauge', center: ['50%', '55%'], radius: '85%',
        min: 0, max: 100,
        axisLine: {
            lineStyle: { width: 12, color: [
                [0.5, '#6bcb77'], [0.8, '#ffd93d'], [1, '#ff6b6b']
            ]}
        },
        axisTick: { show: false },
        splitLine: { show: false },
        axisLabel: { show: false },
        detail: {
            formatter: '{value}%', fontSize: 20, color: '#c8d6e5',
            offsetCenter: [0, '60%']
        },
        data: [{ value: 0 }]
    }]
});

const chartMemDetail = echarts.init(document.getElementById('chart-mem-detail'), undefined, { renderer: 'canvas' });
chartMemDetail.setOption({
    tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
    grid: { left: 90, right: 20, top: 10, bottom: 20 },
    xAxis: { type: 'value', axisLabel: { color: '#889', formatter: '{value} GB' } },
    yAxis: { type: 'category', data: [], axisLabel: { color: '#c8d6e5' } },
    series: [{ type: 'bar', data: [], itemStyle: { color: '#00d2ff' }, barMaxWidth: 18 }]
});

const chartNetwork = echarts.init(document.getElementById('chart-network'), undefined, { renderer: 'canvas' });
chartNetwork.setOption({
    tooltip: { trigger: 'axis' },
    legend: { data: [], textStyle: { color: '#8899aa' } },
    grid: { left: 50, right: 20, top: 40, bottom: 30 },
    xAxis: { type: 'category', data: [], axisLabel: { color: '#556' } },
    yAxis: { type: 'value', name: 'KB/秒', nameTextStyle: { color: '#556' }, axisLabel: { color: '#889' } },
    series: []
});

const chartSoftIrq = echarts.init(document.getElementById('chart-softirq'), undefined, { renderer: 'canvas' });
chartSoftIrq.setOption({
    tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
    legend: { data: [], textStyle: { color: '#8899aa' } },
    grid: { left: 50, right: 20, top: 40, bottom: 30 },
    xAxis: { type: 'category', data: [], axisLabel: { color: '#556' } },
    yAxis: { type: 'value', name: '中断/秒', nameTextStyle: { color: '#556' }, axisLabel: { color: '#889' } },
    series: []
});

const allCharts = [chartCpuLoad, chartCpuUsage, chartMemGauge, chartMemDetail, chartNetwork, chartSoftIrq];
window.addEventListener('resize', () => allCharts.forEach(c => c.resize()));

// ─── Color palette ───

const COLORS = [
    '#00d2ff', '#ff6b6b', '#ffd93d', '#6bcb77', '#a66cff',
    '#ff8a5c', '#45b7d1', '#f472b6', '#84cc16', '#f59e0b',
    '#10b981', '#6366f1', '#ec4899', '#14b8a6', '#f97316',
];
let colorIdx = 0;
function nextColor() { const c = COLORS[colorIdx % COLORS.length]; colorIdx++; return c; }

// ─── Host tabs ───

function renderHostTabs() {
    const container = document.getElementById('host-tabs');
    container.innerHTML = '';
    hostOrder.forEach(name => {
        const tab = document.createElement('button');
        tab.className = 'host-tab' + (name === currentHost ? ' active' : '');
        tab.textContent = name;
        tab.onclick = () => selectHost(name);
        container.appendChild(tab);
    });
    // Update host count in header info
    document.getElementById('hostname').textContent = currentHost || '--';
    document.getElementById('point-count').textContent = currentState()?.times?.length || 0;
}

function selectHost(name) {
    if (name === currentHost || !data[name]) return;
    currentHost = name;
    renderHostTabs();
    renderCurrentHostCharts();
}

// ─── Per-host data update ───

function updateHostData(hostInfo) {
    const name = hostInfo.name || 'unknown';
    ensureHost(name);
    const s = data[name];

    const now = new Date();
    const timeLabel = now.toLocaleTimeString();
    s.times.push(timeLabel);
    if (s.times.length > MAX_POINTS) s.times.shift();

    // CPU Load
    if (hostInfo.cpu_load) {
        const cl = hostInfo.cpu_load;
        s.cpuLoad.load1.push(cl.load_avg_1);
        s.cpuLoad.load3.push(cl.load_avg_3);
        s.cpuLoad.load15.push(cl.load_avg_15);
        if (s.cpuLoad.load1.length > MAX_POINTS) {
            s.cpuLoad.load1.shift(); s.cpuLoad.load3.shift(); s.cpuLoad.load15.shift();
        }
    }

    // CPU Usage per core
    if (hostInfo.cpu_stat && hostInfo.cpu_stat.length) {
        hostInfo.cpu_stat.forEach(c => {
            const coreName = c.cpu_name;
            if (!s.cpuUsage[coreName]) {
                s.cpuUsage[coreName] = [];
                s.cpuUsageExists[coreName] = true;
            }
            s.cpuUsage[coreName].push(c.cpu_percent);
            if (s.cpuUsage[coreName].length > MAX_POINTS) s.cpuUsage[coreName].shift();
        });
    }

    // Memory
    if (hostInfo.mem_info) {
        const mem = hostInfo.mem_info;
        const usedPercent = mem.used_percent || 0;
        s.memGauge.push(usedPercent);
        if (s.memGauge.length > MAX_POINTS) s.memGauge.shift();
    }

    // Network
    if (hostInfo.net_info && hostInfo.net_info.length) {
        hostInfo.net_info.forEach(net => {
            const iface = net.name;
            if (!s.netSeries[iface]) {
                s.netSeries[iface] = { send: [], recv: [] };
                s.netData[iface] = {};
            }
            s.netSeries[iface].send.push(net.send_rate || 0);
            s.netSeries[iface].recv.push(net.rcv_rate || 0);
            if (s.netSeries[iface].send.length > MAX_POINTS) {
                s.netSeries[iface].send.shift();
                s.netSeries[iface].recv.shift();
            }
        });
    }

    // SoftIRQ
    if (hostInfo.soft_irq && hostInfo.soft_irq.length) {
        if (!s.softIrqSeries._inited) {
            hostInfo.soft_irq.forEach(sq => {
                const cpu = sq.cpu;
                s.softIrqSeries[cpu] = {};
                SOFTIRQ_NAMES.forEach(sirq => { s.softIrqSeries[cpu][sirq] = []; });
            });
            s.softIrqSeries._inited = true;
        }
        hostInfo.soft_irq.forEach(sq => {
            const cpu = sq.cpu;
            if (!s.softIrqSeries[cpu]) {
                s.softIrqSeries[cpu] = {};
                SOFTIRQ_NAMES.forEach(sirq => { s.softIrqSeries[cpu][sirq] = []; });
            }
            SOFTIRQ_NAMES.forEach(sirq => {
                const val = sq[sirq] || 0;
                s.softIrqSeries[cpu][sirq].push(val);
                if (s.softIrqSeries[cpu][sirq].length > MAX_POINTS) s.softIrqSeries[cpu][sirq].shift();
            });
        });
    }
}

// ─── Render charts for current host ───

function renderCurrentHostCharts() {
    const s = currentState();
    if (!s) return;

    document.getElementById('hostname').textContent = currentHost;
    document.getElementById('point-count').textContent = s.times.length;

    // CPU Load
    chartCpuLoad.setOption({
        xAxis: { data: s.times },
        series: [
            { data: s.cpuLoad.load1 },
            { data: s.cpuLoad.load3 },
            { data: s.cpuLoad.load15 },
        ]
    });

    // CPU Usage
    const cpuNames = Object.keys(s.cpuUsageExists);
    if (cpuNames.length) {
        const series = cpuNames.map(name => ({
            name, type: 'line', smooth: true,
            data: [...s.cpuUsage[name]],
            lineStyle: { width: 2 },
        }));
        chartCpuUsage.setOption({
            legend: { data: cpuNames },
            xAxis: { data: s.times },
            series,
        });
    }

    // Memory gauge
    if (s.memGauge.length) {
        const val = Math.round(s.memGauge[s.memGauge.length - 1] * 10) / 10;
        chartMemGauge.setOption({
            series: [{ data: [{ value: val }] }]
        });
    }

    // Memory detail - re-fetch from latest hostInfo (stored in latest raw data)
    // We need mem_info from the most recent data point
    if (s._latestMemInfo) {
        const mem = s._latestMemInfo;
        const memItems = [
            { name: 'Total', value: mem.total },
            { name: 'Used', value: mem.total && mem.free ? Math.round((mem.total - mem.free) * 100) / 100 : 0 },
            { name: 'Free', value: mem.free },
            { name: 'Available', value: mem.avail },
            { name: 'Cached', value: mem.cached },
            { name: 'Buffers', value: mem.buffers },
        ];
        chartMemDetail.setOption({
            yAxis: { data: memItems.map(m => m.name).reverse() },
            series: [{ data: memItems.map(m => m.value).reverse() }]
        });
    }

    // Network
    const ifaces = Object.keys(s.netSeries);
    if (ifaces.length) {
        const legendData = [];
        const series = [];
        colorIdx = 0;
        ifaces.forEach(iface => {
            const sendName = iface + ' 发送';
            const recvName = iface + ' 接收';
            const c1 = nextColor();
            const c2 = nextColor();
            legendData.push(sendName, recvName);
            series.push({
                name: sendName, type: 'line', smooth: true,
                data: [...s.netSeries[iface].send],
                lineStyle: { width: 1.5 },
                itemStyle: { color: c1 },
            });
            series.push({
                name: recvName, type: 'line', smooth: true,
                data: [...s.netSeries[iface].recv],
                lineStyle: { width: 1.5, type: 'dashed' },
                itemStyle: { color: c2 },
            });
        });
        chartNetwork.setOption({ legend: { data: legendData }, xAxis: { data: s.times }, series });
    }

    // SoftIRQ
    const cpus = s.softIrqSeries._inited
        ? Object.keys(s.softIrqSeries).filter(k => k !== '_inited')
        : [];
    if (cpus.length) {
        const sortedCpus = cpus.sort();
        const sirqSeries = SOFTIRQ_NAMES.map((sirq, i) => ({
            name: SOFTIRQ_LABELS[i],
            type: 'bar',
            stack: 'total',
            data: sortedCpus.map(cpu => {
                const arr = s.softIrqSeries[cpu]?.[sirq];
                return arr ? arr[arr.length - 1] || 0 : 0;
            }),
            itemStyle: { color: SOFTIRQ_COLORS[i] },
        }));
        chartSoftIrq.setOption({
            legend: { data: SOFTIRQ_LABELS },
            xAxis: { type: 'category', data: sortedCpus },
            series: sirqSeries,
        });
    }
}

// ─── Main update ───

function updateDashboard(rawData) {
    if (rawData.error) return;

    const now = new Date();
    document.getElementById('last-update').textContent = now.toLocaleTimeString();
    document.getElementById('status-dot').className = 'connected';

    const hosts = rawData.hosts || [];
    if (hosts.length === 0) return;

    hosts.forEach(hostInfo => {
        // Store latest mem_info for detail chart
        const name = hostInfo.name || 'unknown';
        ensureHost(name);
        if (hostInfo.mem_info) {
            data[name]._latestMemInfo = hostInfo.mem_info;
        }
        updateHostData(hostInfo);
    });

    // Auto-select first host if none selected
    if (!currentHost || !data[currentHost]) {
        currentHost = hostOrder[0];
        renderHostTabs();
    }

    renderCurrentHostCharts();
}

// ─── WebSocket ───

function connectWs() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = `${proto}//${location.host}/ws`;
    const ws = new WebSocket(wsUrl);

    ws.onopen = () => {
        document.getElementById('status-dot').className = 'connected';
    };

    ws.onmessage = (e) => {
        try {
            const data = JSON.parse(e.data);
            updateDashboard(data);
        } catch (err) {
            console.error('parse error', err);
        }
    };

    ws.onclose = () => {
        document.getElementById('status-dot').className = 'disconnected';
        setTimeout(connectWs, 2000);
    };

    ws.onerror = () => { ws.close(); };
}

// ─── Initial load ───

fetch('/api/monitor')
    .then(r => r.json())
    .then(data => {
        updateDashboard(data);
        setTimeout(connectWs, 500);
    })
    .catch(() => {
        document.getElementById('hostname').textContent = 'gRPC 服务器不可用';
        setTimeout(connectWs, 500);
    });
</script>
</body>
</html>
